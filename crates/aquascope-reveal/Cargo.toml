[package]
name = "aquascope-reveal"
authors = ["Nico Lehmann <nlehmann@ucsd.edu>"]
description = "Build reveal.js slide decks with embedded Aquascope diagrams"
license = "MIT"
version = "0.4.0"
edition = "2021"
include = [
  "src/**/*",
  "assets/**/*",
  "Cargo.toml",
  "js/**/*"
]
repository = "https://github.com/cognitive-engineering-lab/aquascope"

[dependencies]
clap = { version = "=4.3.24", features = ["derive"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = "1"
# Archived upstream but still the de-facto YAML crate. `serde_norway` is a
# maintained drop-in fork if that ever matters.
serde_yaml = "0.9"
pulldown-cmark = { version = "0.9", default-features = false }
mdbook-aquascope = { version = "0.4", path = "../mdbook-aquascope" }
# Renders rustc's coloured diagnostics into the slide. Chosen for
# `four_bit_var_prefix`, which emits CSS variables a deck can restyle.
ansi-to-html = "0.2.3"

[build-dependencies]
anyhow = { workspace = true }
